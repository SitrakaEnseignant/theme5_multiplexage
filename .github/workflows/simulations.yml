# Exécution réelle des simulateurs du Thème 5 (OFDM) : MATLAB/Simulink R2024b et GNU Radio 3.10.
# Résultats : onglet Actions > dernière exécution > Artifacts, et branche « resultats ».
name: Simulations OFDM theme 5
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  simulink:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Ecran virtuel (necessaire a print -s pour exporter les schemas Simulink)
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: Simulink
      - uses: matlab-actions/run-command@v2
        with:
          command: v = ver; fid = fopen('Simulink/versions.txt', 'w'); fprintf(fid, 'MATLAB %s\n', version); for k = 1:numel(v), fprintf(fid, '%s %s %s\n', v(k).Name, v(k).Version, v(k).Release); end; fclose(fid); type('Simulink/versions.txt'); cd('Simulink'); construire_et_verifier_modeles
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultats-simulink
          path: |
            Simulink/*.slx
            Simulink/*.png
            Simulink/*.json
            Simulink/versions.txt
            Simulink/journal_matlab.txt
  gnuradio:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Installer GNU Radio
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gnuradio python3-scipy python3-matplotlib python3-yaml
      - name: Versions utilisees
        run: |
          mkdir -p resultats_gnuradio
          { echo "GNU Radio $(gnuradio-config-info --version)"; lsb_release -ds; python3 --version; python3 -c 'import numpy, scipy; print("numpy", numpy.__version__, "scipy", scipy.__version__)'; } | tee resultats_gnuradio/versions.txt
      - name: Executer les graphes de flux (vrais blocs GNU Radio, compiles par grcc)
        run: python3 En_ligne/executer_grc_ci.py 2>&1 | tee resultats_gnuradio/journal_gnuradio.txt; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultats-gnuradio
          path: |
            resultats_gnuradio/*.png
            resultats_gnuradio/*.json
            resultats_gnuradio/*.txt
  publier:
    needs: [simulink, gnuradio]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: resultats
      - name: Publier dans la branche resultats
        run: |
          cd resultats
          git init -q && git checkout -q -b resultats
          git config user.name "github-actions" && git config user.email "actions@github.com"
          echo "Execution ${GITHUB_RUN_ID} du $(date -u) ; simulink=${{ needs.simulink.result }} ; gnuradio=${{ needs.gnuradio.result }}" > ETAT.txt
          git add -A && git commit -qm "Resultats de l'execution ${GITHUB_RUN_ID}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" resultats
      - uses: actions/checkout@v4
        with:
          path: depot
      - name: Copier les modeles Simulink et les figures dans la branche main
        run: |
          cd depot
          mkdir -p Simulink/modeles Simulink/resultats GNU_Radio/resultats
          cp ../resultats/resultats-simulink/*.slx Simulink/modeles/ 2>/dev/null || true
          cp ../resultats/resultats-simulink/*_schema.png ../resultats/resultats-simulink/*_blocs.json Simulink/modeles/ 2>/dev/null || true
          for f in ../resultats/resultats-simulink/*; do case "$f" in *.slx|*_schema.png|*_blocs.json) ;; *) cp "$f" Simulink/resultats/ ;; esac; done
          cp ../resultats/resultats-gnuradio/* GNU_Radio/resultats/ 2>/dev/null || true
          cp ../resultats/ETAT.txt . 2>/dev/null || true
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A Simulink GNU_Radio ETAT.txt
          git diff --cached --quiet && exit 0
          git commit -qm "Resultats de l'execution ${GITHUB_RUN_ID} (modeles Simulink, schemas, figures) [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
